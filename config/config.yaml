# Fraud Detection System Configuration

data:
  sample_size: 10000  # Number of transactions to generate for demo
  fraud_ratio: 0.02  # 2% fraud rate
  random_state: 42
  test_size: 0.3
  validation_size: 0.15

features:
  numeric_features:
    - amount
    - time_diff
    - hour
    - day_of_week
    - merchant_risk_score
  categorical_features:
    - transaction_type
    - location
  engineered_features:
    - amount_zscore
    - velocity_1h
    - velocity_24h
    - avg_amount_user

models:
  isolation_forest:
    contamination: 0.02
    n_estimators: 100
    max_samples: 256
    random_state: 42
    n_jobs: -1
  
  autoencoder:
    encoding_dim: 8
    hidden_dims: [32, 16]
    epochs: 50
    batch_size: 256
    validation_split: 0.2
    learning_rate: 0.001
    dropout_rate: 0.2

evaluation:
  threshold_range: [0.5, 0.99]
  threshold_steps: 50
  cv_folds: 5

api:
  host: "0.0.0.0"
  port: 8000
  reload: true
  log_level: "info"

dashboard:
  port: 8501
  title: "Fraud Detection Dashboard"
  refresh_interval: 5000  # milliseconds

logging:
  level: "INFO"
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {message}"
  rotation: "100 MB"
  retention: "10 days"
